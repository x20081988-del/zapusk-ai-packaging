<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/zapusk-wordmark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Платформа ZAPUSK AI</title>

    <!-- Apply theme before paint to avoid flash of wrong theme.
         Reads localStorage('zapusk.theme'); default = dark. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('zapusk.theme');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
