# Render.com Infrastructure-as-Code for Zapusk AI Packaging — public demo.
#
# One web service (Node) serves both the API and the compiled SPA from a single
# public URL. A persistent disk holds the SQLite database and uploaded files so
# state survives deploys.
#
# Usage:
#   1. Push the repo to GitHub.
#   2. On Render: New → Blueprint → connect this repo. Render reads this file.
#   3. Fill in the secret env vars (ANTHROPIC_API_KEY or OPENAI_API_KEY) in the
#      dashboard once. Everything else has sensible defaults.
#   4. Deploy. The free tier sleeps after 15 min of inactivity — that's fine for demo.
#
# To switch to a different host (Railway / Fly), see README "Публичный демо-деплой".

services:
  - type: web
    name: zapusk-ai
    runtime: node
    # Sprint 29: persistent disk требуется, чтобы реальные пользователи не
    # терялись на каждый deploy. Render free plan НЕ поддерживает disks —
    # сервис обязательно должен быть на starter+ ($7/mo за 1 GB).
    # Без upgrade'а render.yaml читается, но disk: блок игнорируется и SQLite
    # снова станет ephemeral.
    plan: starter
    region: frankfurt
    # Render auto-sets NODE_ENV=production which would normally cause `npm install`
    # to skip devDependencies (prisma, vite, typescript). install:all passes
    # --include=dev to force every package, so the build has the tools it needs.
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Sprint 29: 1 GB persistent disk для SQLite + uploads. DATABASE_URL и
    # UPLOADS_DIR ниже указывают на /var/data, чтобы данные пережили deploy.
    disk:
      name: zapusk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Keep Render on Node 22 LTS. Prisma 5.22 schema engine is unreliable on
      # the local Node 24 runtime when applying migrations to a fresh SQLite DB.
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      # Sprint 36 P0.3 — blueprint defaults безопасны для production.
      # DEMO_MODE=false → суперадмин может редактировать шаблоны в админке
      # (PATCH /api/templates/:id больше не блокируется demoGuard'ом).
      # ENABLE_DEMO_LOGIN=false → POST /api/auth/demo возвращает 403.
      # ENABLE_HEADER_AUTH=false → x-user-email больше не создаёт пользователей.
      #
      # Если этот деплой — публичная демо-витрина и demo-login / header-auth
      # нужны, ОВЕРРАЙДНИТЕ в Render dashboard → service → Environment:
      #   ENABLE_DEMO_LOGIN=true
      #   ENABLE_HEADER_AUTH=true
      # Dashboard override побеждает yaml. Yaml остаётся safe-by-default —
      # любой новый deploy из blueprint не подхватит опасное поведение.
      - key: DEMO_MODE
        value: "false"
      - key: ENABLE_DEMO_LOGIN
        value: "false"
      - key: ENABLE_HEADER_AUTH
        value: "false"
      # Sprint 29: SQLite и uploads теперь живут на persistent disk.
      # Раньше file:./prod.db и ./uploads оба указывали на ephemeral working
      # directory — каждый deploy создавал новый контейнер с пустой БД,
      # и invited users (luquid@yandex.ru и т.д.) исчезали.
      - key: DATABASE_URL
        value: "file:/var/data/prod.db"
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: CORS_ORIGIN
        value: "*"
      - key: AI_PROVIDER
        value: mock
      # Fill these in the Render dashboard (Secret), not in source.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEV_USER_EMAIL
        value: demo@zapusk.tech
      - key: DEV_USER_NAME
        value: Demo Visitor
